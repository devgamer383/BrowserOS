TelemetryState:
  type: object
  additionalProperties: false
  required: [distinctId, enabled, consent]
  properties:
    distinctId:
      type: string
    enabled:
      type: boolean
    consent:
      type: boolean
UpdateTelemetryRequest:
  type: object
  additionalProperties: false
  required: [consent]
  properties:
    consent:
      type: boolean
AgentSettings:
  type: object
  description: User settings for the tools BrowserOS neo offers to agents.
  additionalProperties: false
  required: [humanHelpEnabled, taskCleanupTipEnabled, jevTokenSource]
  properties:
    humanHelpEnabled:
      type: boolean
      description: >-
        Whether agents are offered request_human_help and await_human_help. When false, agents
        are told to report a block in their own chat instead.
    taskCleanupTipEnabled:
      type: boolean
      description: Whether successful MCP tool replies include a tip to close the task's tab group when finished.
    jevTokenSource:
      $ref: '#/JevTokenSource'
    decisionProvider:
      type: string
      description: Active decision model provider ("cloudflare", "typesafe", or "custom").
    decisionModel:
      type: string
      description: Active decision model identifier (e.g. "@cf/cloudflare/clef-flash").
    decisionEndpoint:
      type: string
      description: Custom decision model endpoint URL if configured.
    cloudflareAccountId:
      type: string
      description: Cloudflare Account ID if configured.
    hasCloudflareToken:
      type: boolean
      description: Whether a Cloudflare API token is saved.
JevTokenSource:
  type: string
  enum: [settings, environment, none]
  description: >-
    Where the decision model credential comes from, which decides whether the pursue tool is
    offered at all. "settings" is a token saved through this API, which takes precedence.
    "environment" is JEV_TOKEN in the server's environment. "none" means pursue is not offered.
    The token itself is never returned.
SaveJevTokenRequest:
  type: object
  additionalProperties: false
  properties:
    token:
      type: string
      description: >-
        The decision model credential. Write only: no endpoint returns it. Saving one takes
        precedence over JEV_TOKEN in the server's environment.
    provider:
      type: string
      description: Provider identifier ("cloudflare", "typesafe", or "custom").
    model:
      type: string
      description: Model name or identifier (e.g. "@cf/cloudflare/clef-flash").
    endpoint:
      type: string
      description: Custom zero-registry decision endpoint URL.
    cloudflareAccountId:
      type: string
      description: Cloudflare Account ID.
    cloudflareApiToken:
      type: string
      description: Cloudflare Workers AI API Token.
UpdateAgentSettingsRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    humanHelpEnabled:
      type: boolean
      description: Omit to preserve the saved human help preference.
    taskCleanupTipEnabled:
      type: boolean
      description: Omit to preserve the saved cleanup tip preference.
